name: ExCompass CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: excompass-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring
          coverage: none
      - name: PHP syntax
        run: find . -name '*.php' -not -path './release/*' -print0 | xargs -0 -n1 php -l
      - name: Smoke checks
        run: php tests/smoke.php
      - name: Scoring checks
        run: php tests/scoring.php
      - name: Storage and workflow checks
        run: php tests/storage.php
      - name: HTTP render smoke
        shell: bash
        run: |
          set -euo pipefail
          export EXCOMPASS_STORAGE_PATH="$RUNNER_TEMP/excompass-storage"
          php -S 127.0.0.1:8097 > "$RUNNER_TEMP/excompass-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8097/health.php >/dev/null; then break; fi
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:8097/ | grep -q "Pune,"
          curl -fsS "http://127.0.0.1:8097/rankings.php?vertical=real-estate" | grep -q "25"
          curl -fsS "http://127.0.0.1:8097/search.php?q=Baner" | grep -q "Baner"
          curl -fsS "http://127.0.0.1:8097/entity.php?vertical=real-estate&slug=godrej-emerald-waters" | grep -q "Godrej Emerald Waters"
          curl -fsS http://127.0.0.1:8097/methodology.php | grep -q "ranking should explain itself"
          curl -fsS http://127.0.0.1:8097/health.php | grep -q '"ok":true'

  release:
    runs-on: ubuntu-latest
    needs: [php]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring
          coverage: none
      - name: Build DigiOps release payload
        run: php tools/package-release.php
      - name: Verify DigiOps release payload
        run: php tools/check-release-package.php
      - name: PHP syntax in packaged runtime
        run: find release/public release/private -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Upload DigiOps release artifact
        uses: actions/upload-artifact@v4
        with:
          name: digiops-release
          path: release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
