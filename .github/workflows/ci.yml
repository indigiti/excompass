name: ExCompass CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: excompass-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring
          coverage: none
      - name: PHP syntax
        run: find . -name '*.php' -not -path './release/*' -print0 | xargs -0 -n1 php -l
      - name: Smoke checks
        run: php tests/smoke.php
      - name: Scoring checks
        run: php tests/scoring.php
      - name: Storage and workflow checks
        run: php tests/storage.php
      - name: HTTP render smoke
        shell: bash
        run: |
          set -euo pipefail
          export EXCOMPASS_STORAGE_PATH="$RUNNER_TEMP/excompass-storage"
          php -S 127.0.0.1:8097 -t . > "$RUNNER_TEMP/excompass-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          READY=0
          for i in {1..50}; do
            if curl -fsS http://127.0.0.1:8097/health.php -o "$RUNNER_TEMP/health.json"; then READY=1; break; fi
            sleep 0.2
          done
          if [ "$READY" != "1" ]; then cat "$RUNNER_TEMP/excompass-http.log"; exit 1; fi
          fetch_page(){ curl -fsS "$1" -o "$2" || { cat "$RUNNER_TEMP/excompass-http.log"; exit 1; }; }
          assert_contains(){ if ! grep -Fq "$2" "$1"; then echo "HTTP_ASSERTION_FAILED: $3"; echo "Expected: $2"; head -c 3000 "$1" || true; echo; cat "$RUNNER_TEMP/excompass-http.log" || true; exit 1; fi; echo "PASS  $3"; }

          fetch_page "http://127.0.0.1:8097/" "$RUNNER_TEMP/home.html"
          fetch_page "http://127.0.0.1:8097/rankings.php?vertical=real-estate" "$RUNNER_TEMP/ranking.html"
          fetch_page "http://127.0.0.1:8097/search.php?q=Baner" "$RUNNER_TEMP/search.html"
          fetch_page "http://127.0.0.1:8097/entity.php?vertical=real-estate&slug=godrej-emerald-waters" "$RUNNER_TEMP/entity.html"
          fetch_page "http://127.0.0.1:8097/compare.php?vertical=real-estate&items=godrej-emerald-waters,lodha-panache" "$RUNNER_TEMP/compare.html"
          fetch_page "http://127.0.0.1:8097/report.php?vertical=real-estate" "$RUNNER_TEMP/report.html"
          fetch_page "http://127.0.0.1:8097/methodology.php" "$RUNNER_TEMP/methodology.html"

          assert_contains "$RUNNER_TEMP/home.html" "Pune," "homepage renders"
          assert_contains "$RUNNER_TEMP/ranking.html" "Filter the shortlist" "rich ranking workspace renders"
          assert_contains "$RUNNER_TEMP/ranking.html" "₹ 1.1 Cr" "real estate working facts render"
          assert_contains "$RUNNER_TEMP/ranking.html" "images.unsplash.com" "ranking remote photography renders"
          assert_contains "$RUNNER_TEMP/search.html" "Baner" "search renders Baner matches"
          assert_contains "$RUNNER_TEMP/entity.html" "ExCompass score breakdown" "rich entity scoring renders"
          assert_contains "$RUNNER_TEMP/entity.html" "Explore the area" "locality intelligence renders"
          assert_contains "$RUNNER_TEMP/entity.html" "Score provenance" "evidence metadata renders"
          assert_contains "$RUNNER_TEMP/entity.html" "Representative demo photography" "image provenance renders"
          assert_contains "$RUNNER_TEMP/entity.html" "images.unsplash.com" "profile remote gallery renders"
          assert_contains "$RUNNER_TEMP/compare.html" "Compare Real Estate" "comparison renders"
          assert_contains "$RUNNER_TEMP/report.html" "Ranking Report" "report renders"
          assert_contains "$RUNNER_TEMP/methodology.html" "ranking should explain itself" "methodology renders"
          assert_contains "$RUNNER_TEMP/health.json" '"ok":true' "health endpoint renders"

  release:
    runs-on: ubuntu-latest
    needs: [php]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring
          coverage: none
      - name: Build DigiOps release payload
        run: php tools/package-release.php
      - name: Verify DigiOps release payload
        run: php tools/check-release-package.php
      - name: PHP syntax in packaged runtime
        run: find release/public release/private -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Upload DigiOps release artifact
        uses: actions/upload-artifact@v4
        with:
          name: digiops-release
          path: release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
